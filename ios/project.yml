name: RhythmRecovery
options:
  bundleIdPrefix: com.rhythmrecovery
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  RhythmCore:
    path: RhythmCore
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.55.0

targets:
  RhythmRecovery:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RhythmRecovery
        excludes:
          - "Resources/Assets.xcassets"
      - path: RhythmRecovery/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: RhythmCore
        product: RhythmCore
      - package: Supabase
        product: Supabase
    configFiles:
      Debug: RhythmRecovery/Resources/Secrets.xcconfig
      Release: RhythmRecovery/Resources/Secrets.xcconfig
    settings:
      base:
        # NOTE: placeholder bundle id / no development team set. Update these
        # (or set them in Xcode's Signing & Capabilities tab) before building
        # for a real device or archiving for TestFlight/App Store.
        PRODUCT_BUNDLE_IDENTIFIER: com.rhythmrecovery.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Rhythm Recovery
        SupabaseURL: https://$(SUPABASE_PROJECT_HOST)
        SupabaseAnonKey: $(SUPABASE_ANON_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        NSUserNotificationsUsageDescription: >-
          Rhythm Recovery uses notifications to remind you if today's checklist
          is still open.
        # Only standard HTTPS/TLS is used (no custom cryptography), so this
        # skips the export-compliance prompt on every TestFlight/App Store
        # upload.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Generated/RhythmRecovery.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default

  RhythmRecoveryTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: RhythmRecoveryTests
    dependencies:
      - target: RhythmRecovery
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RhythmRecovery:
    build:
      targets:
        RhythmRecovery: all
        RhythmRecoveryTests: [test]
    test:
      targets:
        - RhythmRecoveryTests
    run:
      config: Debug
